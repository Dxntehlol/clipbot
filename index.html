<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipBot sign-in</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #222; background: #fafafa; }
  textarea { width: 100%; height: 7rem; font-family: monospace; font-size: 13px; }
  button { font-size: 15px; padding: .5rem 1rem; }
  .ok { color: #1a7f37; }
</style>
</head>
<body>
<h1>ClipBot sign-in</h1>
<p id="msg">Copy the address below and paste it into the terminal where <code>social_login.py</code> is waiting.</p>
<textarea id="url" readonly></textarea>
<p><button id="copy">Copy address</button> <span id="done" class="ok"></span></p>
<script>
  document.getElementById('url').value = location.href;
  if (!location.search.includes('code=')) {
    document.getElementById('msg').textContent = 'This page only does something at the end of a sign-in.';
  }
  document.getElementById('copy').onclick = async () => {
    await navigator.clipboard.writeText(location.href);
    document.getElementById('done').textContent = 'Copied';
  };
</script>
</body>
</html>
